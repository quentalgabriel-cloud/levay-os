name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Deploy API
        run: |
          echo "Deploying API..."
          # Add deployment commands here
          # e.g., vercel deploy, fly deploy, etc.
      
      - name: Deploy Web
        run: |
          echo "Deploying Web..."
          # Add deployment commands here
      
      - name: Health Check
        run: |
          echo "Running health check..."
          # Add health check commands
      
      - id: deploy
        run: |
          echo "url=https://levay-os.example.com" >> $GITHUB_OUTPUT
          echo "✅ Deployment complete"

  notify:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
      - name: Notify on success/failure
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed"
          fi